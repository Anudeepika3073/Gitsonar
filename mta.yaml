_schema-version: "3.1"
ID: capire.sflight
version: 1.0.0
description: "CAP sflight demo"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx -p @sap/cds-dk cds build --profile production,node

modules:
  - name: sflight-srv
    type: nodejs
    path: .
    parameters:
      memory: 256M
    build-parameters:
      builder: npm-ci

resources:
  - name: sflight-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
